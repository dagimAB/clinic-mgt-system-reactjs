services:
  - type: web
    name: shms-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd Backend && npm install
    startCommand: cd Backend && npm run start:render
    rootDir: Backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3007"
      - key: PG_HOST
        value: ""
      - key: PG_USER
        value: postgres
      - key: PG_PASSWORD
        value: ""
      - key: PG_DATABASE
        value: neondb
      - key: PG_PORT
        value: "5432"
      - key: PG_SSL
        value: "true"
      - key: KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: ""
